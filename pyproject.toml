[project]
name = "cadence-md"
version = "0.0.1"
description = "CADENCE-MD is an intelligent medical assistant that helps doctors make evidence-based decisions by providing instant access to clinical guidelines and the latest medical research through advanced RAG architecture and PubMed integration."
authors = [
    {name = "Sergey Sysoev",email = "sergey.sys@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "dvc[s3] (>=3.66.1,<4.0.0)",
    "qdrant-client (>=1.16.2,<2.0.0)",
    "langgraph (>=1.0.7,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "flagembedding (>=1.3.5,<2.0.0)",
    "langchain (>=1.2.7,<2.0.0)",
    "langchain-huggingface (>=1.2.0,<2.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "pypdf (>=6.6.0,<7.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "langchain-gigachat (==0.3.13a1)",
    "ragas (>=0.4.3,<0.5.0)",
    "langchain-openai (>=1.1.11,<2.0.0)",
    "fastembed (>=0.7.4,<0.8.0)",
    "pymupdf (>=1.27.2.2,<2.0.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.5.0,<4.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "langfuse (>=4.5.1,<5.0.0)"
]

[dependency-groups]
dev = [
    "pre-commit (>=4.4.0,<5.0.0)",
    "ruff (>=0.14.5,<0.15.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.setuptools.packages.find]
where = ["cadence_md",]

[tool.poetry]
requires-poetry = ">=2.0"
package-mode = false

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    # isort
    "I",
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-builtins
    "A",
    # flake8-return
    "RET",
    # flake8-use-pathlib
    "PTH",
    # flynt
    "FLY",
    # mccabe
    "C90",
    # NumPy-specific rules
    "NPY",
    # pep8-naming
    "N",
    # Ruff-specific rules
    "RUF",
    # Pylint - very strict, may be use when have enough time
    "PL",
    # refurb - also may be overwhelming
    "FURB",
]

per-file-ignores = { "cadence_md/backend/api/**/*.py" = ["B008"] }

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR0913",
    "PLR2004",
    "C901",
    "PLR0915",
    "PLR0912"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 50

[tool.codespell]
skip = "*.lock"

[tool.pytest.ini_options]
addopts = "-p no:warnings"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require external services (postgres/redis/docker)",
    "smoke: lightweight end-to-end smoke checks",
]
