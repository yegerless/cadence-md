apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: grafana
data:
  datasources-prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: CADENCE-MD
        orgId: 1
        folder: CADENCE-MD
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
