apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: cadence-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - backend:8000

      - job_name: cadence-rag-worker
        metrics_path: /metrics
        static_configs:
          - targets:
              - rag-worker:9100
