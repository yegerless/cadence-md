apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: edge-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence-md
      app.kubernetes.io/component: edge-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence-md
        app.kubernetes.io/component: edge-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: edge-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: edge-nginx-config
          configMap:
            name: edge-nginx-config
