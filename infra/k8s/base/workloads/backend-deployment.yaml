apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence-md
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence-md
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: cadence-md-backend:prod
          command:
            - sh
            - -c
            - >
              exec uvicorn cadence_md.backend.main:app --host 0.0.0.0 --port
              8000 --proxy-headers --forwarded-allow-ips "*" --workers
              "${BACKEND_UVICORN_WORKERS}"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cadence-md-config
            - secretRef:
                name: cadence-md-secret
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: rag-corpus
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: rag-corpus
          persistentVolumeClaim:
            claimName: rag-corpus
