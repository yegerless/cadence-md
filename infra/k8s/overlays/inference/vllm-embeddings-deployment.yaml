apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-embeddings
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: vllm-embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence-md
      app.kubernetes.io/component: vllm-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence-md
        app.kubernetes.io/component: vllm-embeddings
    spec:
      hostIPC: true
      nodeSelector:
        accelerator: nvidia-gpu
      containers:
        - name: vllm-embeddings
          image: vllm/vllm-openai:latest
          command:
            - sh
            - -c
            - >
              exec vllm serve "${VLLM_EMBEDDINGS_MODEL}" --host 0.0.0.0 --port
              8080 --runner pooling --served-model-name
              "${VLLM_EMBEDDINGS_SERVED_MODEL_NAME}" --max-model-len
              "${VLLM_EMBEDDINGS_MAX_MODEL_LEN}" --max-num-batched-tokens
              "${VLLM_EMBEDDINGS_MAX_NUM_BATCHED_TOKENS}" --ubatch-size
              "${VLLM_EMBEDDINGS_UBATCH_SIZE}" --gpu-memory-utilization
              "${VLLM_EMBEDDINGS_GPU_MEMORY_UTILIZATION}" --api-key
              "${MODEL_INFERENCE_API_KEY}" ${VLLM_EMBEDDINGS_EXTRA_ARGS}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cadence-md-secret
                  key: HF_TOKEN
            - name: MODEL_INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cadence-md-secret
                  key: MODEL_INFERENCE_API_KEY
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import os, urllib.request;
                  req=urllib.request.Request('http://localhost:8080/v1/models',
                  headers={'Authorization':'Bearer ' +
                  os.environ.get('MODEL_INFERENCE_API_KEY','')});
                  urllib.request.urlopen(req, timeout=5).read()"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 20
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import os, urllib.request;
                  req=urllib.request.Request('http://localhost:8080/v1/models',
                  headers={'Authorization':'Bearer ' +
                  os.environ.get('MODEL_INFERENCE_API_KEY','')});
                  urllib.request.urlopen(req, timeout=5).read()"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: vllm-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: vllm-cache
          persistentVolumeClaim:
            claimName: vllm-cache
