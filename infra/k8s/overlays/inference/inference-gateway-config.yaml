apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-config
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: inference-gateway
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        client_max_body_size 8m;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/models {
            access_log off;
            default_type application/json;
            return 200 '{"object":"list","data":[{"id":"bge-m3","object":"model","owned_by":"vllm"},{"id":"bge-reranker-v2-m3","object":"model","owned_by":"vllm"},{"id":"medgemma","object":"model","owned_by":"vllm"}]}';
        }

        location = /v1/embeddings {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_pass http://vllm-embeddings:8080;
        }

        location ~ ^/(v1/rerank|rerank|v2/rerank|v1/score|score)$ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_pass http://vllm-reranker:8080;
        }

        location ~ ^/(v1/chat/completions|v1/completions|v1/responses|tokenize|detokenize)$ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 10s;
            proxy_send_timeout 360s;
            proxy_read_timeout 360s;
            proxy_pass http://vllm-llm:8080;
        }
    }
