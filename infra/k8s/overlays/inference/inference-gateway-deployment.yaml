apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  labels:
    app.kubernetes.io/name: cadence-md
    app.kubernetes.io/component: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence-md
      app.kubernetes.io/component: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence-md
        app.kubernetes.io/component: inference-gateway
    spec:
      containers:
        - name: inference-gateway
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: inference-gateway-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: inference-gateway-config
          configMap:
            name: inference-gateway-config
