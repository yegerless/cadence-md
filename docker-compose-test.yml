services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-cadence_md_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-cadence_md}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-cadence_md_dev}
    ports:
      - 127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - 127.0.0.1:${TEST_REDIS_PORT:-56379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant-test:
    image: qdrant/qdrant:v1.16.3
    profiles: ["with-qdrant"]
    ports:
      - 127.0.0.1:${TEST_QDRANT_PORT:-56333}:6333
    healthcheck:
      test: ["CMD-SHELL", "grep -q '18BD' /proc/net/tcp || kill 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
